<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./assets/logos/caprice-mark-dark.svg" type="image/svg+xml" />
    <title>Caprice Visual House</title>
    <script>
      const preferred = (navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en";
      location.replace(`./${preferred}/${location.hash}`);
    </script>
  </head>
  <body>
    <p><a href="./en/">English</a> · <a href="./ar/">العربية</a></p>
  </body>
</html>
